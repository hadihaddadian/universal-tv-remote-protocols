name: Android CI + Protocol Repository (V63)

on:
  push:
  pull_request:

# The private application repository only needs read access for the main CI.
# Cross-repository protocol publication uses the narrowly scoped
# PROTOCOL_REPOSITORY_TOKEN secret and does not use Pages permissions here.
permissions:
  contents: read

env:
  GRADLE_VERSION: '8.11.1'
  PROTOCOL_REPOSITORY: 'hadihaddadian/universal-tv-remote-protocols'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Repository invariants
        run: python3 tools/verify_project.py

      - name: Validate protocol repository
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          python3 tools/protocol_repo/build_repository.py protocol-repository
          python3 tools/protocol_repo/verify_repository.py protocol-repository --public-key tools/keys/dev-protocol-public-key.b64

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Clean build outputs
        run: gradle clean --no-daemon --stacktrace

      - name: Unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Lint debug and release
        run: gradle lintDebug lintRelease --no-daemon --stacktrace

      - name: Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Release APK (unsigned unless external signing properties are supplied)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: universal-tv-remote-v63-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  publish-protocol-repository:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate repository manifest
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          python3 tools/protocol_repo/build_repository.py protocol-repository
          python3 tools/protocol_repo/verify_repository.py protocol-repository --public-key tools/keys/dev-protocol-public-key.b64

      - name: Publish protocol repository to public repository
        env:
          PROTOCOL_REPOSITORY_TOKEN: ${{ secrets.PROTOCOL_REPOSITORY_TOKEN }}
          PROTOCOL_REPOSITORY: ${{ env.PROTOCOL_REPOSITORY }}
        run: |
          set -euo pipefail
          test -n "$PROTOCOL_REPOSITORY_TOKEN" || {
            echo "ERROR: PROTOCOL_REPOSITORY_TOKEN is not configured in the private app repository."
            exit 1
          }

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          git clone --depth 1 "https://x-access-token:${PROTOCOL_REPOSITORY_TOKEN}@github.com/${PROTOCOL_REPOSITORY}.git" "$workdir/public"
          cd "$workdir/public"
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            git checkout -b main
          fi

          # Keep the target repository a pure static distribution repository.
          # Remove the previous generated tree before copying the newly verified tree.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$GITHUB_WORKSPACE/protocol-repository/." .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "Protocol repository is already up to date."
            exit 0
          fi

          git commit -m "Publish protocol repository from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push origin HEAD:main
